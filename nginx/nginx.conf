# CF-Connecting-IP верим только со входа туннеля (82, не опубликован): на 8090 его может подставить кто угодно.
map $server_port $cf_connecting_ip {
    82      $http_cf_connecting_ip;
    default "";
}

# X-Forwarded-For клиента верим только от админского входа: он проксирует сюда с 127.0.0.1 (так тесты и populate задают IP).
# На 8090 и 82 ingest получает адрес соединения, подставить свой IP заголовком нельзя.
map $remote_addr $client_xff {
    127.0.0.1 $http_x_forwarded_for;
    default   $remote_addr;
}

# Зрительский вход (8090 на всех интерфейсах; 82 — для cloudflared): только страница голосования и /api/.
server {
    listen 80;
    listen 82;
    root /srv/static;  # web/
    # Docker DNS on every request: a repeated `make up` restarts app containers with new IPs
    resolver 127.0.0.11 valid=1s;
    add_header Cache-Control no-cache;  # стенд: браузер всегда сверяет версию страницы и скриптов

    location / {
        return 404;
    }

    location = /vote.js {}
    location = /fp.js {}
    location /vendor/ {}

    # /p/{poll_id} -> web/index.html
    location /p/ {
        try_files /index.html =404;
    }

    # /p/{poll_id}/config.json -> file published by admin (WEB_ROOT)
    location ~ ^/p/[^/]+/config\.json$ {
        root /srv/web;
    }

    location /api/ {
        set $ingest ingest;
        proxy_pass http://$ingest:8000;
        proxy_set_header X-Forwarded-For $client_xff;
        proxy_set_header CF-Connecting-IP $cf_connecting_ip;  # пустое значение — заголовок не передаётся
    }
}

# Админский вход (только 127.0.0.1:8091): всё то же плюс /admin/ и /manage/; IP голоса можно задать заголовком X-Forwarded-For.
server {
    listen 81;
    absolute_redirect off;  # /manage -> /manage/ без потери порта
    resolver 127.0.0.11 valid=1s;

    # /manage/ -> web/manage/ (index.html)
    location /manage {
        root /srv/static;
        add_header Cache-Control no-cache;
    }

    location /admin/ {
        set $admin admin;
        proxy_pass http://$admin:8000;
    }

    # остальное — как у зрителей
    location / {
        proxy_pass http://127.0.0.1:80;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
