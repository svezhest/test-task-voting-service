server {
    listen 80;
    root /srv/static;  # web/
    add_header Cache-Control no-cache;  # стенд: браузер всегда сверяет версию страницы и скриптов

    # /p/{poll_id} -> web/index.html
    location /p/ {
        try_files /index.html =404;
    }

    # /p/{poll_id}/config.json -> file published by admin (WEB_ROOT)
    location ~ ^/p/[^/]+/config\.json$ {
        root /srv/web;
    }

    location /api/ {
        proxy_pass http://ingest:8000;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://admin:8000;
    }
}
