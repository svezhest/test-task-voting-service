<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опрос</title>
<style>
  :root { color-scheme: light dark; font: 18px/1.4 system-ui, -apple-system, sans-serif; }
  body { margin: 0 auto; padding: 16px; max-width: 480px; }
  h1 { font-size: 1.3em; }
  fieldset { border: 0; padding: 0; margin: 0; }
  label { display: flex; gap: 12px; align-items: center; padding: 14px; margin: 8px 0; border: 1px solid #8888; border-radius: 10px; }
  input { width: 22px; height: 22px; margin: 0; flex: none; }
  button { width: 100%; margin-top: 8px; padding: 14px; font: inherit; border: 0; border-radius: 10px; background: #0a6cff; color: #fff; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<h1 id="q">Загрузка…</h1>
<form id="form">
  <fieldset id="f" disabled>
    <div id="opts"></div>
    <button id="btn">Голосовать</button>
  </fieldset>
</form>
<p id="status" role="status"></p>
<!-- STUB: пути к скриптам в docs не заданы. Относительный "vote.js" со страницы /p/{id} ушёл бы в /p/vote.js,
     а nginx отдаёт там index.html. Берём корень: /fp.js и /vote.js (web/ смонтирован как корень статики). -->
<script src="/fp.js"></script>
<script src="/vote.js"></script>
</body>
</html>
