<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Опрос</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafaf8; --fg: #1d1d1b; --muted: #74746e; --line: #dcdcd6; --accent: #2f6b8f;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --fg: #e8e8e3; --muted: #9a9a93; --line: #34342f; --accent: #88b5d1; }
  }
  * { box-sizing: border-box; border-radius: 0; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  main { max-width: 560px; margin: 0 auto; padding: 64px 24px 96px; }
  h1, h2, button, li, .hint { font-family: var(--mono); font-weight: 500; }
  h1 { font-size: 1.5rem; line-height: 1.35; margin: 0; }
  .hint { font-size: .8rem; color: var(--muted); margin: 12px 0 48px; }
  fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
  label { display: flex; gap: 16px; align-items: center; padding: 20px; border: 1px solid var(--line); cursor: pointer; }
  label + label { margin-top: 12px; }
  label:has(:checked) { border-color: var(--accent); }
  input { appearance: none; -webkit-appearance: none; flex: none; width: 18px; height: 18px; margin: 0;
    border: 1px solid var(--muted); background: transparent; }
  input:checked { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--bg); }
  input:focus-visible, button:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
  button { display: block; min-width: 50%; min-height: 48px; margin-top: 32px; padding: 10px 28px; font-size: .9rem;
    color: var(--fg); background: transparent; border: 1px solid var(--accent); cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #status { min-height: 1.6em; margin: 24px 0 0; font-size: .9rem; color: var(--muted); }
  #msg { margin-top: 56px; }
  h2 { font-size: 2rem; line-height: 1.2; margin: 0 0 40px; }
  .label { margin: 0 0 12px; font-size: .9rem; color: var(--muted); }
  ul { list-style: none; margin: 0 0 40px; padding: 0; }
  li { padding: 2px 0 2px 16px; border-left: 1px solid var(--accent); }
  li + li { margin-top: 10px; }
  #note { margin: 0; color: var(--muted); }
  .debug { margin: 72px 0 0; padding-top: 24px; border-top: 1px solid var(--line); color: var(--muted);
    font: 12px/1.6 var(--mono); white-space: pre-wrap; word-break: break-all; }
  @media (min-width: 640px) { main { padding-top: 120px; } h1 { font-size: 1.75rem; } }
</style>
</head>
<body>
<main>
  <h1 id="q">Загрузка…</h1>
  <form id="form" hidden>
    <p class="hint" id="hint"></p>
    <fieldset id="f" disabled>
      <div id="opts"></div>
      <button id="btn">Голосовать</button>
    </fieldset>
  </form>
  <section id="msg" hidden>
    <h2 id="title"></h2>
    <div id="chosen">
      <p class="label">Вы выбрали:</p>
      <ul id="choice"></ul>
    </div>
    <p id="note"></p>
  </section>
  <p id="status" role="status"></p>
</main>
<!-- STUB: пути к скриптам в docs не заданы. Относительный "vote.js" со страницы /p/{id} ушёл бы в /p/vote.js,
     а nginx отдаёт там index.html. Берём корень: /fp.js и /vote.js (web/ смонтирован как корень статики). -->
<script src="/vendor/confetti.js?v=1"></script>
<script src="/fp.js?v=5"></script>
<script src="/vote.js?v=5"></script>
</body>
</html>
